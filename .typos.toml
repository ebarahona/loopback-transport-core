# Configuration for crate-ci/typos
# https://github.com/crate-ci/typos
[files]
extend-exclude = [
  "package-lock.json",
  "dist/",
  "node_modules/",
  ".husky/_/",
  "*.snap",
]

[default]
extend-ignore-re = [
  # Hex strings (likely ObjectId examples, hashes)
  "[0-9a-fA-F]{24,}",
  # ObjectId literal references
  "ObjectId",
  # GUIDs
  "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
]

[default.extend-words]
# Framework
loopback = "loopback"
# Query operators
nin = "nin"
# Transport-core specific
rxjs = "rxjs"
grpc = "grpc"
nats = "nats"
mqtt = "mqtt"
kafka = "kafka"
pubsub = "pubsub"
oneway = "oneway"
